name: PR assignee & reviewer

# On every new pull request:
# - the author is set as the assignee (so the PR shows up in their own queue), and
# - a review is requested from the repo owner (belt-and-braces alongside
#   CODEOWNERS, which does the same thing for files it matches).
#
# pull_request_target runs with a write token from the base branch, which is
# what lets it edit the PR. It never checks out or runs the PR's code, so that
# is safe even for pull requests from forks.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  assign:
    name: Assign author, request review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          REVIEWER: jobzshala
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const reviewer = process.env.REVIEWER;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            if (!pr.assignees.some((a) => a.login === author)) {
              await github.rest.issues.addAssignees({ ...repo, issue_number: pr.number, assignees: [author] });
              core.info(`Assigned #${pr.number} to its author @${author}`);
            }

            // GitHub refuses a review request from the PR's own author, so
            // the owner's own PRs simply skip this step.
            if (author !== reviewer && !pr.requested_reviewers.some((r) => r.login === reviewer)) {
              await github.rest.pulls.requestReviewers({ ...repo, pull_number: pr.number, reviewers: [reviewer] });
              core.info(`Requested review on #${pr.number} from @${reviewer}`);
            }
