name: CI

# Runs on every PR into main and on every push to main.
# - Type-check and Build are required (blocking) checks.
# - Lint is advisory for now: main currently has 7 pre-existing ESLint
#   errors, so the step reports a warning annotation instead of failing.
#   Once `pnpm lint` is clean on main, drop the `|| ...` fallback below to
#   make it blocking.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run already in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reuse Next's incremental build cache between runs so unchanged
      # pages aren't recompiled from scratch every time.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: |
          if pnpm lint; then
            echo "### ESLint: clean ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=ESLint::ESLint reported problems. This check is advisory until main is lint-clean — see the job log."
            echo "### ESLint: problems found ⚠️ (advisory, not blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "See the ESLint step log for file/line details." >> "$GITHUB_STEP_SUMMARY"
          fi
